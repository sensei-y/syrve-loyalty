# Ограничение попыток входа по IP — до проксирования в api (дорогой scrypt не запускается).
# Файл подключается внутри блока http, поэтому limit_req_zone здесь допустим.
limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;

server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Вход: 10 попыток в минуту с одного IP (+5 подряд), сверх — 429.
  location = /api/auth/login {
    limit_req zone=login burst=5 nodelay;
    limit_req_status 429;
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # API за тем же origin — без CORS, cookie работают как есть
  location /api/ {
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # SPA: любой неизвестный путь отдаёт index.html
  location / {
    try_files $uri /index.html;
  }
}
